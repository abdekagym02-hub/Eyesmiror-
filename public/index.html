<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EyesMiror</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #d6a84f;
        }

        .profile {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .welcome {
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #999;
        }

        .balance-card {
            background: linear-gradient(135deg, #19150d, #29200f);
            border: 1px solid #6d5420;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 18px;
        }

        .balance-title {
            color: #aaa;
            font-size: 14px;
        }

        .balance {
            color: #e0b653;
            font-size: 38px;
            font-weight: bold;
            margin: 10px 0;
        }

        .points {
            color: #888;
        }

        .mine-card {
            background: #15151b;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
            text-align: center;
        }

        .mine-card h3 {
            margin-bottom: 8px;
        }

        .rate {
            color: #aaa;
            margin-bottom: 18px;
        }

        .mine-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            background: #d6a84f;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .mine-button.active {
            background: #6f5724;
            color: white;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: #15151b;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .card-title {
            color: #aaa;
            font-size: 13px;
        }

        .card-value {
            margin-top: 7px;
            font-size: 20px;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: auto;
            height: 70px;
            background: #111116;
            border-top: 1px solid #25252c;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-button {
            background: none;
            border: none;
            color: #777;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-button span {
            display: block;
            font-size: 22px;
            margin-bottom: 3px;
        }

        .nav-button.active {
            color: #d6a84f;
        }

        .loading {
            text-align: center;
            color: #aaa;
            margin-top: 30px;
        }

        .error {
            background: #2a1515;
            border: 1px solid #633;
            color: #ff9999;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">👁️ EyesMiror</div>
        <div class="profile">👤</div>
    </div>

    <div class="welcome">
        <h2>مرحبًا، <span id="username">مستخدم</span> 👋</h2>
        <p>ابدأ بجمع نقاط EyesMiror</p>
    </div>

    <div id="loading" class="loading">
        جاري تحميل الحساب...
    </div>

    <div id="error" class="error">
        تعذّر الاتصال بالسيرفر
    </div>

    <div id="app" style="display:none;">

        <div class="balance-card">
            <div class="balance-title">رصيدك</div>

            <div class="balance">
                <span id="balance">0.00</span>
            </div>

            <div class="points">EM Points</div>
        </div>

        <div class="mine-card">

            <h3>⛏️ جمع النقاط</h3>

            <div class="rate">
                معدل الجمع: <b>0.10</b> نقطة / دقيقة
            </div>

            <button
                id="mineButton"
                class="mine-button"
                onclick="toggleMining()">
                🚀 ابدأ جمع النقاط
            </button>

        </div>

        <div class="cards">

            <div class="card">
                <div class="card-icon">👥</div>
                <div class="card-title">الأصدقاء</div>
                <div class="card-value" id="friends">0</div>
            </div>

            <div class="card">
                <div class="card-icon">⭐</div>
                <div class="card-title">المستوى</div>
                <div class="card-value" id="level">1</div>
            </div>

        </div>

    </div>

</div>

<div class="bottom-nav">

    <button class="nav-button active">
        <span>🏠</span>
        الرئيسية
    </button>

    <button class="nav-button">
        <span>⛏️</span>
        الجمع
    </button>

    <button class="nav-button">
        <span>🎁</span>
        المهام
    </button>

    <button class="nav-button">
        <span>👥</span>
        الأصدقاء
    </button>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let balance = 0;
let friends = 0;
let level = 1;

let mining = false;

const miningRate = 0.10;

const usernameElement = document.getElementById("username");
const balanceElement = document.getElementById("balance");
const friendsElement = document.getElementById("friends");
const levelElement = document.getElementById("level");

const loadingElement = document.getElementById("loading");
const errorElement = document.getElementById("error");
const appElement = document.getElementById("app");

const mineButton = document.getElementById("mineButton");


async function loadUser() {

    try {

        const initData = tg.initData;

        if (!initData) {
            throw new Error("Telegram initData غير موجود");
        }

        const response = await fetch("/api/user", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                initData: initData
            })

        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "خطأ في السيرفر");
        }

        const user = data.user;

        balance = Number(user.balance) || 0;
        friends = Number(user.friends) || 0;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {

            const telegramUser = tg.initDataUnsafe.user;

            usernameElement.textContent =
                telegramUser.first_name ||
                telegramUser.username ||
                "مستخدم";

        } else {

            usernameElement.textContent =
                user.first_name ||
                user.username ||
                "مستخدم";

        }

        updateUI();

        loadingElement.style.display = "none";
        errorElement.style.display = "none";
        appElement.style.display = "block";

    }

    catch (error) {

        console.error(error);

        loadingElement.style.display = "none";
        errorElement.style.display = "block";
        appElement.style.display = "none";

    }

}


function updateUI() {

    balanceElement.textContent = balance.toFixed(2);

    friendsElement.textContent = friends;

    level = Math.floor(balance / 100) + 1;

    levelElement.textContent = level;

}


function toggleMining() {

    mining = !mining;

    if (mining) {

        mineButton.textContent = "⏸️ إيقاف جمع النقاط";

        mineButton.classList.add("active");

    } else {

        mineButton.textContent = "🚀 ابدأ جمع النقاط";

        mineButton.classList.remove("active");

    }

}


setInterval(function() {

    if (!mining) {
        return;
    }

    balance += miningRate / 60;

    updateUI();

}, 1000);


loadUser();

</script>

</body>
</html>
